<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="app-version" content="4.1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Автоклавы и Котельная">
  <title>Справочник: Автоклавное отделение и Котельная · v4.1.0</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-card">
      <svg class="loading-logo" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="24" stroke="url(#lg1)" stroke-width="5"/>
        <path d="M32 14v18l13 9" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
        <defs><linearGradient id="lg1" x1="8" y1="8" x2="56" y2="56"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
      </svg>
      <h2>Подготовка справочника</h2>
      <p id="loadingStatus">Загружаем текст, схемы и поиск…</p>
      <div class="loading-track"><div id="loadingProgress" class="loading-bar"></div></div>
      <div id="loadingPercent" class="loading-percent">0%</div>
      <p class="loading-note">Не закрывайте окно до завершения</p>
    </div>
  </div>

  <div class="app">
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="url(#sg1)" stroke-width="2"/><path d="M12 5v7l5 3.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="sg1" x1="3" y1="3" x2="21" y2="21"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs></svg>
        </div>
        <div>
          <div class="sidebar-title">Справочник оператора</div>
          <div class="sidebar-sub">Автоклавы · Котельная</div>
        </div>
      </div>
      <nav id="sidebarNav" class="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div class="net-dot"></div>
        <span id="networkStatusText">Оффлайн-база</span>
        <span id="sidebarVersion" class="sidebar-version">v4.1.0</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuToggle" class="icon-btn" aria-label="Меню">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="search">
          <svg class="search-ic" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Поиск: клапан, давление, SCADA, ПЗК…" autocomplete="off">
          <button id="clearSearch" class="icon-btn search-clear" aria-label="Очистить" hidden>
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div id="searchResults" class="search-results" hidden></div>
      <div id="content" class="content"></div>
    </main>
  </div>
  <script src="./manual.js"></script>
  <script src="./loading.js"></script>
  <script src="./app.js"></script>
</body>
</html>
